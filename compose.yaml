# Example composition for a single GitlabMCP container. Copy this file, drop the ".example" mindset,
# and edit the three lines marked below — everything else is a sane default (docker-aot-image skill §6/§7).
#
#   cp gitlab_token.txt.example gitlab_token.txt   # then put a real PAT in it, see the note below
#   docker compose up -d
#
# The image is published by .github/workflows/release.yml on every "vX.Y.Z" tag, as
# <dockerhub-user>/gitlabmcp:X.Y.Z-amd64 and :latest-amd64 (README.md "Container images").
services:
  gitlabmcp:
    image: gitlabmcp:latest-amd64 # <-- replace with <your-dockerhub-user>/gitlabmcp:latest-amd64, or build locally
    ports:
      - "127.0.0.1:9080:9080" # loopback-only by default; widen deliberately, never bind 0.0.0.0 on the host side
    environment:
      # Which of the four profiles this container advertises (CLAUDE.md "Target architecture: profiles").
      # Absent -> Maintainer. One of: Maintainer | Developer | DevOps | FullPermission.
      GitLabMcp__Profile: Developer

      # Absent -> https://gitlab.com/api/v4/. Just set this to your own instance's URL — a self-hosted
      # domain ("https://gitlab.example.com"), a path-prefixed install ("https://example.com/gitlab"), or
      # a non-standard port ("https://gitlab.internal:8443") — "api/v4/" is appended automatically if it
      # isn't already there (GitLabBaseAddressNormalizerTests / GitLabGraphQlEndpointTests pin this down).
      # A path that already ends in the wrong API version (e.g. ".../api/v5/") is left alone and fails
      # fast at startup instead of being silently rewritten.
      GitLab__BaseAddress: "https://gitlab.com/api/v4/"
    secrets:
      - GitLab__AccessToken # mounted at /run/secrets/GitLab__AccessToken (DEC-013 Tier 2), never an env var here
    restart: unless-stopped

secrets:
  GitLab__AccessToken:
    file: ./gitlab_token.txt # printf '%s' "$YOUR_PAT" > gitlab_token.txt -- NOT echo, it appends a newline
